<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icon Panel</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --preview-sz: 24px; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: #ffffff;
      color: #1a1a1a;
    }

    /* ── Full-height flex layout ──────────────────────────── */
    #app        { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #top-panel  { flex-shrink: 0; }
    #scroll-area{ flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
    #sel-bar    { flex-shrink: 0; }



    input, button, select { font-family: inherit; font-size: inherit; }
    button { cursor: pointer; }

    ::-webkit-scrollbar { width: 16px; }
    ::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 8px; border: 4px solid transparent; background-clip: padding-box; }

    /* ── Library tabs ─────────────────────────────────────── */
    .lib-tabs {
      display: flex;
      border-bottom: 1px solid #e5e5e5;
      background: #fafafa;
    }
    .lib-tab {
      flex: 1;
      padding: 7px 2px;
      text-align: center;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      color: #999;
      border-bottom: 2px solid transparent;
      line-height: 1.4;
      transition: color .1s;
      user-select: none;
    }
    .lib-tab:hover { color: #555; background: #f0f0f0; }
    .lib-tab.on { color: #0078d4; border-bottom-color: #0078d4; }

    /* ── Section dividers ─────────────────────────────────── */
    .section { border-bottom: 1px solid #e8e8e8; }

    /* ── Search ───────────────────────────────────────────── */
    .search-wrap { position: relative; }
    .search-wrap input {
      width: 100%;
      padding: 6px 28px 6px 28px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
      background: #fff;
      color: #1a1a1a;
    }
    .search-wrap input:focus { border-color: #0078d4; }
    .search-wrap .si {
      position: absolute; left: 8px; top: 50%;
      transform: translateY(-50%);
      font-size: 14px; color: #aaa; pointer-events: none;
    }
    .search-wrap .sc {
      position: absolute; right: 8px; top: 50%;
      transform: translateY(-50%);
      font-size: 14px; color: #aaa;
    }
    .search-wrap .sc:hover { color: #555; }

    /* ── Dropdowns ────────────────────────────────────────── */
    .dd-trigger {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; cursor: pointer; user-select: none;
    }
    .dd-trigger:hover { background: #f5f5f5; }
    .dd-left { display: flex; align-items: center; gap: 6px; }
    .dd-lbl { font-size: 11px; color: #888; }
    .dd-val {
      font-size: 11px; background: #f0f0f0; border: 1px solid #e0e0e0;
      border-radius: 999px; padding: 2px 7px; max-width: 90px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333;
    }
    .dd-chev { font-size: 12px; color: #aaa; transition: transform .15s; flex-shrink: 0; }
    .dd-chev.open { transform: rotate(180deg); }
    .dd-body { display: none; background: #fafafa; }
    .dd-body.open { display: block; }
    .opt-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 12px; cursor: pointer; font-size: 12px; color: #1a1a1a;
    }
    .opt-row:hover { background: #efefef; }
    .opt-chk {
      width: 14px; height: 14px; border-radius: 3px;
      border: 1.5px solid #ccc; background: #fff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .opt-chk i { font-size: 9px; color: #0078d4; display: none; }
    .opt-row.active .opt-chk { background: #dbeeff; border-color: #0078d4; }
    .opt-row.active .opt-chk i { display: block; }
    .opt-tick { font-size: 12px; color: #0078d4; visibility: hidden; }
    .opt-row.active .opt-tick { visibility: visible; }

    /* ── Results row ──────────────────────────────────────── */
    .results-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 12px 3px;
    }
    .results-row span { font-size: 11px; color: #aaa; }
    .view-btns { display: flex; gap: 6px; }
    .view-btns i { font-size: 14px; color: #aaa; cursor: pointer; }
    .view-btns i.on { color: #333; }
    .pzb { padding: 2px 5px; font-size: 10px; font-weight: 600; border-radius: 3px; border: 1px solid #ddd; background: transparent; color: #888; cursor: pointer; }
    .pzb.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* ── Icon grid ────────────────────────────────────────── */
    #icon-grid {
      padding: 4px 8px 8px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
    }

    /* ── List view ────────────────────────────────────────── */
    #icon-grid.list-view { grid-template-columns: 1fr; padding: 4px 8px; }
    #icon-grid.list-view .ip-cell {
      flex-direction: row; justify-content: flex-start;
      padding: 6px 10px; gap: 10px; border-radius: 4px;
    }
    #icon-grid.list-view .ip-cell .icn { font-size: 18px; flex-shrink: 0; }
    #icon-grid.list-view .ip-cell .lbl {
      font-size: 11px; color: #555; text-align: left;
      width: auto; white-space: normal; overflow: visible;
    }
    #icon-grid.list-view .ip-cell.sel .lbl { color: #0078d4; }
    #icon-grid.list-view .chk-badge { top: 50%; right: 8px; transform: translateY(-50%); }

    .ip-cell {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 7px 2px 5px;
      border-radius: 5px; cursor: pointer;
      border: 1.5px solid transparent;
      gap: 3px; position: relative; user-select: none;
    }
    .ip-cell:hover { background: #f0f0f0; }
    .ip-cell.sel { border-color: #0078d4; background: #dbeeff; }
    .ip-cell .icn { font-size: var(--preview-sz); color: #333; line-height: 1; }
    /* Material Icons font renders via text content of a span */
    .mat-icn { font-size: 20px !important; line-height: 1 !important; display: block !important; width: auto !important; }
    /* Phosphor icons */
    .ph.icn, [class^="ph-"].icn { font-size: 20px; line-height: 1; }
    .ip-cell.sel .icn { color: #0078d4; }
    .ip-cell .lbl {
      font-size: 8.5px; color: #aaa; text-align: center;
      width: 50px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; line-height: 1;
    }
    .ip-cell.sel .lbl { color: #0078d4; }
    .chk-badge {
      position: absolute; top: 2px; right: 2px;
      width: 13px; height: 13px; border-radius: 50%;
      background: #dbeeff; border: 1.5px solid #0078d4;
      display: none; align-items: center; justify-content: center;
    }
    .chk-badge i { font-size: 8px; color: #0078d4; }
    .ip-cell.sel .chk-badge { display: flex; }

    .grid-msg {
      grid-column: 1 / -1;
      text-align: center; padding: 2rem 1rem;
      font-size: 12px; color: #aaa;
    }

    /* ── Selection bar ────────────────────────────────────── */
    #sel-bar {
      padding: 10px 12px;
      background: #fafafa;
      border-top: 1px solid #e8e8e8;
      transition: opacity .15s;
    }
    /* sel-bar is always fully visible; only the insert button changes state */

    .sel-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 8px;
    }
    .sel-header span { font-size: 11px; font-weight: 600; color: #333; }
    .sel-header button {
      font-size: 11px; color: #888; background: none;
      border: none; padding: 0;
    }
    .sel-header button:hover { color: #333; }

    .preview-strip {
      display: flex; gap: 4px; margin-bottom: 10px;
      min-height: 34px; max-height: 72px;
      align-items: flex-start; flex-wrap: wrap;
      overflow-y: auto;
    }
    .prev-chip {
      width: 32px; height: 32px; background: #fff;
      border: 1px solid #e0e0e0; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      position: relative; flex-shrink: 0;
    }
    .prev-chip i { font-size: 16px; color: #333; }
    .prev-chip .rm {
      position: absolute; top: -4px; right: -4px;
      width: 13px; height: 13px; border-radius: 50%;
      background: #888; display: flex; align-items: center;
      justify-content: center; cursor: pointer;
    }
    .prev-chip .rm:hover { background: #444; }
    .prev-chip .rm i { font-size: 8px; color: #fff; }

    /* ── Size buttons ─────────────────────────────────────── */
    .ctrl-row { display: flex; align-items: center; gap: 6px; margin-bottom: 9px; }
    .ctrl-lbl { font-size: 11px; color: #888; width: 36px; flex-shrink: 0; }
    .szb {
      width: 32px; height: 24px; border-radius: 4px;
      font-size: 10px; border: 1px solid #ddd;
      background: transparent; color: #777;
      padding: 0; display: inline-flex;
      align-items: center; justify-content: center; line-height: 1;
    }
    .szb:hover { background: #f0f0f0; }
    .szb.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* ── Color ────────────────────────────────────────────── */
    .color-block { display: flex; gap: 6px; margin-bottom: 10px; }
    .color-block .ctrl-lbl { padding-top: 4px; }
    .color-inner { flex: 1; }

    .swatches { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; }
    .cdot {
      width: 16px; height: 16px; border-radius: 50%;
      cursor: pointer; box-sizing: border-box;
      border: 2px solid transparent; flex-shrink: 0;
    }
    .cdot:hover { transform: scale(1.15); }
    .cdot.on { outline: 2px solid #0078d4; outline-offset: 2px; }

    .hex-row { display: flex; align-items: center; gap: 5px; }
    .hex-box {
      display: flex; align-items: center;
      border: 1px solid #ddd; border-radius: 4px;
      flex: 1; overflow: hidden; background: #fff;
    }
    .hex-box:focus-within { border-color: #0078d4; }
    .hex-swatch { width: 22px; height: 26px; flex-shrink: 0; border-right: 1px solid #ddd; }
    .hex-hash { font-size: 11px; color: #aaa; padding: 0 2px 0 5px; }
    .hex-inp {
      flex: 1; min-width: 0;
      font-size: 11px; font-family: 'Courier New', monospace;
      border: none; background: transparent;
      padding: 4px 4px 4px 0; color: #1a1a1a; outline: none;
      text-transform: uppercase;
    }
    .picker-btn {
      width: 28px; height: 28px; flex-shrink: 0;
      border: 1px solid #ddd; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      position: relative; background: #fff;
    }
    .picker-btn:hover { background: #f5f5f5; }
    .picker-btn i { font-size: 14px; color: #888; pointer-events: none; }
    .picker-btn input[type=color] {
      opacity: 0; position: absolute; inset: 0;
      width: 100%; height: 100%; cursor: pointer; border: none; padding: 0;
    }

    /* ── Insert button ────────────────────────────────────── */
    #ins-btn {
      width: 100%; padding: 7px; font-size: 12px; font-weight: 600;
      border-radius: 5px; margin-top: 2px;
      /* Disabled / nothing selected: outlined */
      border: 1.5px solid #0078d4; background: #fff; color: #0078d4; cursor: default;
    }
    #ins-btn:not(:disabled) {
      /* Active / icons selected: filled (inverted) */
      background: #0078d4; color: #fff; cursor: pointer;
    }
    #ins-btn:not(:disabled):hover { background: #106ebe; border-color: #106ebe; }
    #ins-btn:disabled { opacity: 1; }

    #status {
      font-size: 11px; text-align: center;
      margin-top: 6px; min-height: 16px; color: #888;
    }
    #status.ok { color: #1a1a1a; }
    #status.err { color: #c62828; }
  </style>
</head>
<body>

<div id="app">

  <!-- Fixed top panel -->
  <div id="top-panel">


    <!-- Search -->
    <div class="section" style="padding:10px 12px">
      <div class="search-wrap">
        <i class="ti ti-search si" aria-hidden="true"></i>
        <input id="search-inp" type="text" placeholder="Search icons…"
               autocomplete="off" spellcheck="false"
               oninput="onSearch(this.value)">
        <i class="ti ti-x sc" aria-label="Clear search" onclick="clearSearch()"></i>
      </div>
    </div>

    <!-- Style + Category in one row -->
    <div style="display:flex;border-bottom:1px solid #e8e8e8">
      <div style="flex:1;border-right:1px solid #e8e8e8">
        <div class="dd-trigger" onclick="toggleDd('style-body','style-chev')">
          <div class="dd-left">
            <span class="dd-lbl">Style</span>
            <div class="dd-val" id="style-val">Outlined</div>
          </div>
          <i id="style-chev" class="ti ti-chevron-down dd-chev" aria-hidden="true"></i>
        </div>
      </div>
      <div style="flex:1">
        <div class="dd-trigger" onclick="toggleDd('cat-body','cat-chev')">
          <div class="dd-left">
            <span class="dd-lbl">Category</span>
            <div class="dd-val" id="cat-val">All</div>
          </div>
          <i id="cat-chev" class="ti ti-chevron-down dd-chev" aria-hidden="true"></i>
        </div>
      </div>
    </div>
    <!-- Dropdown bodies — appear full-width below the trigger row -->
    <div id="style-body" class="dd-body section"></div>
    <div id="cat-body"   class="dd-body section"></div>

    <!-- Results count + preview size + view toggle -->
    <div class="results-row section" style="padding-bottom:3px">
      <span id="result-count">Loading…</span>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="display:flex;gap:2px">
          <button class="pzb" data-size="18" onclick="setPreviewSize(18)" title="Small preview">S</button>
          <button class="pzb on" data-size="24" onclick="setPreviewSize(24)" title="Medium preview">M</button>
          <button class="pzb" data-size="32" onclick="setPreviewSize(32)" title="Large preview">L</button>
          <button class="pzb" data-size="44" onclick="setPreviewSize(44)" title="X-Large preview">XL</button>
        </div>
        <div class="view-btns">
          <i class="ti ti-layout-grid on" data-view="grid" onclick="setView('grid')" title="Grid view" aria-label="Grid view"></i>
          <i class="ti ti-list"           data-view="list" onclick="setView('list')" title="List view" aria-label="List view"></i>
        </div>
      </div>
    </div>

  </div><!-- /top-panel -->

  <!-- Scrollable icon grid -->
  <div id="scroll-area">
    <div id="icon-grid" role="list"></div>
  </div>

  <!-- Selection / insert bar -->
  <div id="sel-bar">

    <div class="sel-header">
      <span id="sel-label">0 selected</span>
      <button onclick="clearAll()">Clear all</button>
    </div>

    <div id="preview-strip" class="preview-strip">
      <span id="strip-ph" style="font-size:11px;color:#bbb">Tap icons above to select</span>
    </div>

    <!-- Size -->
    <div class="ctrl-row">
      <span class="ctrl-lbl">Size</span>
      <div style="display:flex;gap:3px">
        <button class="szb"    onclick="setSize(16,this)">16</button>
        <button class="szb"    onclick="setSize(20,this)">20</button>
        <button class="szb"    onclick="setSize(24,this)">24</button>
        <button class="szb"    onclick="setSize(32,this)">32</button>
        <button class="szb on" onclick="setSize(48,this)">48</button>
      </div>
    </div>

    <!-- Color -->
    <div class="color-block">
      <span class="ctrl-lbl">Color</span>
      <div class="color-inner">
        <div class="swatches">
          <div class="cdot on"   style="background:#1A1A1A" onclick="swatchClick(this,'#1A1A1A')" title="Black"></div>
          <div class="cdot"      style="background:#757575" onclick="swatchClick(this,'#757575')" title="Gray"></div>
          <div class="cdot"      style="background:#0078D4" onclick="swatchClick(this,'#0078D4')" title="Blue"></div>
          <div class="cdot"      style="background:#D32F2F" onclick="swatchClick(this,'#D32F2F')" title="Red"></div>
          <div class="cdot"      style="background:#388E3C" onclick="swatchClick(this,'#388E3C')" title="Green"></div>
          <div class="cdot"      style="background:#F57C00" onclick="swatchClick(this,'#F57C00')" title="Orange"></div>
        </div>
        <div class="hex-row">
          <div class="hex-box">
            <div class="hex-swatch" id="hex-swatch" style="background:#1A1A1A"></div>
            <span class="hex-hash">#</span>
            <input class="hex-inp" id="hex-inp" type="text" maxlength="6"
                   value="1A1A1A" spellcheck="false" aria-label="Hex colour"
                   oninput="onHexInput(this.value)">
          </div>
          <div class="picker-btn" title="Open colour picker">
            <i class="ti ti-color-swatch" aria-hidden="true"></i>
            <input type="color" id="clr-picker" value="#1a1a1a"
                   aria-label="Colour picker" oninput="onPickerInput(this.value)">
          </div>
        </div>
      </div>
    </div>

    <button id="ins-btn" disabled onclick="insertSelected()">
      Insert icons into slide
    </button>
    <div id="status"></div>

  </div>
</div>

<script>
'use strict';

// ── Library configurations ───────────────────────────────────────────────

const LIBS = {
  material: {
    name: 'Material Icons',
    cdnBase: 'https://unpkg.com/@material-design-icons/svg@0.14.13',
    styles: ['filled','outlined','rounded','sharp'],
    defaultStyle: 'outlined',
    colorMode: 'fill',
    pkg: '@material-design-icons/svg@0.14.13',
    svgUrl(icon, style) {
      return `${this.cdnBase}/${style}/${icon.name}.svg`;
    },
    metaUrl: 'https://unpkg.com/@material-design-icons/svg@0.14.13/filled/?meta',
    parseFiles(files) {
      return (files || [])
        .filter(f => f.path && f.path.endsWith('.svg'))
        .map(f => {
          const name = f.path.split('/').pop().replace('.svg', '');
          return { name, label: name.replace(/_/g, ' '), cat: guessCategory(name) };
        });
    }
  }
};

// Keyword-based category guesser for dynamically loaded icon names
function guessCategory(name) {
  const n = name.toLowerCase();
  if (/mail|phone|chat|message|send|inbox|notif|bell|announc|person|people|group|contact|user/.test(n)) return 'Communication';
  if (/arrow|chevron|caret|menu|nav|map|location|pin|compass|direction|back|forward/.test(n))           return 'Navigation';
  if (/file|folder|doc|cloud|download|upload|archive|attach|save|floppy|storage/.test(n))               return 'Files';
  if (/chart|graph|bar|pie|trend|data|analytic|table|report|statistic|metric/.test(n))                  return 'Charts';
  if (/camera|photo|image|video|music|play|pause|mic|volume|audio|speaker|film|record/.test(n))         return 'Media';
  if (/desktop|mobile|tablet|watch|device|battery|wifi|bluetooth|usb|cpu|keyboard|hardware/.test(n))    return 'Devices';
  if (/cart|shop|credit|payment|truck|shipping|store|package|bag|receipt|order/.test(n))                return 'Shopping';
  if (/calendar|clock|time|alarm|schedule|event|date|timer/.test(n))                                    return 'Calendar';
  if (/heart|star|thumb|favorite|bookmark|share|like|social|flag|rate/.test(n))                         return 'Social';
  if (/lock|shield|key|security|password|private|encrypt|auth|safe/.test(n))                            return 'Security';
  if (/edit|pencil|write|pen|draw|paint|brush|format|text|font/.test(n))                                return 'Editor';
  if (/build|tool|wrench|gear|settings|config|code|terminal|debug/.test(n))                             return 'Development';
  return 'General';
}

async function loadFullIconList(libId) {
  // Already loaded and cached
  if (ICON_CACHE[libId]) {
    if (S.lib === libId) {
      S.icons = ICON_CACHE[libId];
      buildCatDropdown();
      renderGrid();
    }
    return;
  }

  const lib = LIBS[libId];
  if (!lib.metaUrl || !lib.parseFiles) return;

  try {
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 15000);
    const r = await fetch(lib.metaUrl, { signal: controller.signal });
    clearTimeout(tid);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const icons = lib.useRawData ? lib.parseFiles(data) : lib.parseFiles(data.files || []);
    if (!icons.length) throw new Error('empty list');
    ICON_CACHE[libId] = icons;

    if (S.lib === libId) {
      // Reset category if it no longer exists in the loaded set
      const newCats = [...new Set(icons.map(i => i.cat))];
      if (S.category !== 'all' && !newCats.includes(S.category)) S.category = 'all';
      S.icons = icons;
      buildCatDropdown();
      renderGrid();
    }
  } catch (e) {
    console.warn('Full icon list load failed for ' + libId + ':', e.message);
    // Seed data remains in S.icons — no action needed
  }
}

// ── Filtered icon list ───────────────────────────────────────────────────

function filtered() {
  const all = S.icons;
  const q   = S.query.toLowerCase();
  return all.filter(ic => {
    const catOk = S.category === 'all' || ic.cat === S.category;
    const qOk   = !q || ic.name.includes(q) || ic.label.includes(q) || ic.cat.toLowerCase().includes(q);
    return catOk && qOk;
  });
}

// ── SVG fetch and colorize ───────────────────────────────────────────────

async function fetchSVG(url) {
  if (S.svgCache[url]) return S.svgCache[url];
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} — ${url}`);
  const text = await r.text();
  S.svgCache[url] = text;
  return text;
}

function colorizeSVG(svgText, color, colorMode, size) {
  const parser = new DOMParser();
  const doc    = parser.parseFromString(svgText, 'image/svg+xml');
  const svg    = doc.documentElement;

  if (colorMode === 'stroke') {
    svg.setAttribute('stroke', color);
    svg.querySelectorAll('[stroke]').forEach(el => {
      if (el.getAttribute('stroke') !== 'none') el.setAttribute('stroke', color);
    });
  } else {
    svg.setAttribute('fill', color);
    svg.querySelectorAll('[fill]').forEach(el => {
      if (el.getAttribute('fill') !== 'none') el.setAttribute('fill', color);
    });
  }

  // Set explicit size so PowerPoint sizes the shape correctly on insertion
  svg.setAttribute('width',  size + 'px');
  svg.setAttribute('height', size + 'px');

  return new XMLSerializer().serializeToString(svg);
}

// ── Office.js insertion ──────────────────────────────────────────────────

// Build a single composite SVG containing all icons side by side.
// Inserting one SVG lands everything together on the slide.
function buildCompositeSVG(svgTexts, size) {
  if (svgTexts.length === 1) return svgTexts[0];
  const gap = Math.round(size * 0.5);
  const total = svgTexts.length * size + (svgTexts.length - 1) * gap;
  const parser = new DOMParser();
  const serial = new XMLSerializer();
  let out = `<svg xmlns="http://www.w3.org/2000/svg" width="${total}" height="${size}">`;
  svgTexts.forEach((svgText, i) => {
    const doc = parser.parseFromString(svgText, 'image/svg+xml');
    const svg = doc.documentElement;
    const vb  = svg.getAttribute('viewBox') || `0 0 ${size} ${size}`;
    const x   = i * (size + gap);
    out += `<svg x="${x}" y="0" width="${size}" height="${size}" viewBox="${vb}">`;
    Array.from(svg.childNodes).forEach(n => { out += serial.serializeToString(n); });
    out += `</svg>`;
  });
  return out + `</svg>`;
}

function insertSvgAsync(svgString) {
  return new Promise((resolve, reject) => {
    Office.context.document.setSelectedDataAsync(
      svgString,
      { coercionType: Office.CoercionType.XmlSvg },
      result => {
        if (result.status === Office.AsyncResultStatus.Failed) {
          reject(new Error(result.error.message));
        } else {
          resolve();
        }
      }
    );
  });
}

async function insertSelected() {
  if (!S.selected.size) return;

  const btn    = document.getElementById('ins-btn');
  const status = document.getElementById('status');
  btn.disabled       = true;
  btn.textContent    = 'Fetching SVGs…';
  status.textContent = '';
  status.className   = '';

  const lib   = LIBS[S.lib];
  const icons = S.icons.filter(ic => S.selected.has(ic.name));
  const errors = [];

  try {
    const svgMap = {};
    for (const ic of icons) {
      try {
        const url = lib.svgUrl(ic, S.style, S.size);
        const raw = await fetchSVG(url);
        svgMap[ic.name] = colorizeSVG(raw, S.color, lib.colorMode, S.size);
      } catch (e) {
        errors.push(ic.label);
      }
    }

    btn.textContent = 'Inserting…';

    const toInsert = icons.filter(ic => svgMap[ic.name]);
    if (toInsert.length > 0) {
      const composite = buildCompositeSVG(toInsert.map(ic => svgMap[ic.name]), S.size);
      try {
        await insertSvgAsync(composite);
      } catch (e) {
        errors.push(...toInsert.map(ic => ic.label));
      }
    }

    const inserted = icons.length - errors.length;
    status.textContent = inserted
      ? `${inserted} icon${inserted > 1 ? 's' : ''} inserted.` +
        (errors.length ? ` ${errors.length} failed: ${errors.join(', ')}.` : '')
      : `All inserts failed: ${errors.join(', ')}.`;
    status.className = errors.length ? 'err' : 'ok';

  } catch (e) {
    status.textContent = `Error: ${e.message}`;
    status.className   = 'err';
  }

  renderSelBar();
}

// ── Utility ──────────────────────────────────────────────────────────────

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function closePane() {
  try {
    if (typeof Office !== 'undefined' && Office.addin && Office.addin.hide) {
      Office.addin.hide();
    } else {
      window.close();
    }
  } catch (e) { window.close(); }
}

function toggleAbout() {
  const st = document.getElementById('status');
  if (st.textContent.startsWith('Icon Panel')) {
    st.textContent = '';
    st.className = '';
  } else {
    st.textContent = 'Icon Panel™ by Themis · Google Material Icons · v1.0';
    st.className = '';
  }
}

// ── Init ─────────────────────────────────────────────────────────────────

document.addEventListener('click', e => {
  if (!e.target.closest('.dd-trigger') && !e.target.closest('.dd-body')) closeDds();
});

function init() {
  switchLib('material');
}

if (typeof Office !== 'undefined') {
  Office.onReady(info => {
    // Works in both PowerPoint and browser (for local testing without Office)
    init();
  });
} else {
  // No Office.js available — browser preview mode
  init();
}
</script>
